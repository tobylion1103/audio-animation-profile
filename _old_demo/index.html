<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@todou | demo</title>
    <meta name="description" content="demo profile — animated biolink page" />
    <meta name="theme-color" content="#050508" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true">
      <video
        id="bgVideo"
        class="bg-video"
        src="assets/bg.mp4"
        muted
        loop
        playsinline
        preload="auto"
      ></video>
      <div class="bg-tint"></div>
      <canvas id="snow" class="fx-canvas"></canvas>
      <canvas id="cursorTrail" class="fx-canvas cursor-trail"></canvas>
    </div>

    <div id="customCursor" class="custom-cursor" aria-hidden="true"></div>

    <div id="enterGate" class="enter-gate">
      <button type="button" id="enterBtn" class="enter-btn">
        <span class="enter-label">click to enter...</span>
      </button>
    </div>

    <main id="app" class="app is-hidden" hidden>
      <header class="top-meta">
        <button type="button" class="chip copy-chip" data-copy="todou#1042" title="Copy UID tag">
          <span class="chip-label">UID</span>
          <span id="uidValue">1042</span>
        </button>
        <div class="chip" title="Profile views">
          <span class="chip-label">Views</span>
          <span id="viewsValue">0</span>
        </div>
      </header>

      <section class="profile" aria-label="Profile">
        <div class="avatar-wrap">
          <div class="avatar-ring" aria-hidden="true"></div>
          <img
            id="avatar"
            class="avatar"
            src="https://api.dicebear.com/9.x/adventurer/svg?seed=todou&backgroundColor=1a1a2e"
            alt="todou avatar"
            draggable="false"
          />
          <span class="avatar-deco" aria-hidden="true"></span>
          <span class="status-dot online" title="Online"></span>
        </div>

        <div class="name-row">
          <h1 id="displayName" class="display-name">
            <span class="name-text">todou</span>
            <span class="name-sparkles" aria-hidden="true"></span>
          </h1>
          <div class="badges" aria-label="Badges">
            <span class="badge premium glow" title="Premium">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 19h14v2H5v-2zm7-16l4.5 7.5L21 8l-3 9H6L3 8l4.5 2.5L12 3z"/></svg>
            </span>
            <span class="badge verified glow" title="Verified">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.4 2.1l3.2-.4l.8 3.1l2.9 1.4l-1.5 2.9l1.5 2.9l-2.9 1.4l-.8 3.1l-3.2-.4L12 22l-2.4-2.1l-3.2.4l-.8-3.1L2.7 16l1.5-2.9L2.7 10l2.9-1.4l.8-3.1l3.2.4L12 2zm-1.1 12.7l5.3-5.3l-1.4-1.4l-3.9 3.9l-1.8-1.8l-1.4 1.4l3.2 3.2z"/></svg>
            </span>
            <span class="badge donor glow" title="Early supporter">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>
            </span>
            <span class="badge custom glow" title="D4HJ">
              <img src="https://api.dicebear.com/9.x/shapes/svg?seed=d4&backgroundColor=c78cff" alt="" draggable="false" />
            </span>
            <span class="badge custom glow" title="Cat">
              <img src="https://api.dicebear.com/9.x/bottts/svg?seed=cat&backgroundColor=transparent" alt="" draggable="false" />
            </span>
          </div>
        </div>

        <p class="alias">aka <span>d4hj</span></p>

        <p id="bio" class="bio" aria-live="polite">
          <span id="bioText"></span><span class="caret" aria-hidden="true">|</span>
        </p>

        <div class="presence" aria-label="Discord presence">
          <div class="presence-avatar-wrap">
            <img
              class="presence-avatar"
              src="https://api.dicebear.com/9.x/adventurer/svg?seed=todou&backgroundColor=1a1a2e"
              alt=""
              draggable="false"
            />
            <span class="status-dot online small" title="Online"></span>
          </div>
          <div class="presence-body">
            <div class="presence-top">
              <div class="presence-name">todou</div>
              <div class="presence-tags">
                <span class="guild-tag">D4HJ</span>
              </div>
            </div>
            <div class="presence-status">
              <span class="spotify-dot"></span>
              <span class="presence-activity">Listening to Midnight Demo</span>
            </div>
            <div class="presence-meta">Discord · Online</div>
          </div>
        </div>

        <nav class="socials" aria-label="Social links">
          <button type="button" class="social copy-chip" data-copy="todou" title="Copy Discord">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.1 16.1 0 0 0-4.8 0c-.14-.34-.36-.76-.54-1.09c-.01-.02-.04-.03-.07-.03c-1.5.26-2.93.71-4.27 1.33c-.01 0-.02.01-.03.02c-2.72 4.07-3.47 8.03-3.1 11.95c0 .02.01.04.03.05c1.8 1.32 3.53 2.12 5.24 2.65c.03.01.06 0 .07-.02c.4-.55.76-1.13 1.07-1.74c.02-.04 0-.08-.04-.09c-.57-.22-1.11-.48-1.64-.78c-.04-.02-.04-.08-.01-.11c.11-.08.22-.17.33-.25c.02-.02.05-.02.07-.01c3.44 1.57 7.15 1.57 10.55 0c.02-.01.05-.01.07.01c.11.09.22.17.33.26c.04.03.04.09-.01.11c-.52.31-1.07.56-1.64.78c-.04.01-.05.06-.04.09c.32.61.68 1.19 1.07 1.74c.02.02.05.03.08.02c1.72-.53 3.45-1.33 5.25-2.65c.02-.01.03-.03.03-.05c.44-4.53-.73-8.46-3.1-11.95c-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.83 2.12-1.89 2.12z"/></svg>
          </button>
          <a class="social" href="https://x.com" target="_blank" rel="noopener" title="X">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2H21.5l-7.5 8.57L22.5 22h-6.59l-5.17-6.75L5.2 22H1.94l8.03-9.17L1.5 2h6.75l4.67 6.18L18.244 2zm-1.16 18h1.82L7.02 3.94H5.07L17.084 20z"/></svg>
          </a>
          <a class="social" href="https://github.com" target="_blank" rel="noopener" title="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.7c.5.1.68-.22.68-.48c0-.24-.01-.87-.01-1.7c-2.78.62-3.37-1.37-3.37-1.37c-.45-1.18-1.11-1.5-1.11-1.5c-.91-.64.07-.63.07-.63c1 .07 1.53 1.06 1.53 1.06c.89 1.56 2.34 1.11 2.91.85c.09-.66.35-1.11.63-1.37c-2.22-.26-4.55-1.14-4.55-5.07c0-1.12.39-2.03 1.03-2.75c-.1-.26-.45-1.31.1-2.73c0 0 .84-.27 2.75 1.05c.8-.23 1.65-.34 2.5-.34c.85 0 1.7.11 2.5.34c1.91-1.32 2.75-1.05 2.75-1.05c.55 1.42.2 2.47.1 2.73c.64.72 1.03 1.63 1.03 2.75c0 3.94-2.34 4.8-4.57 5.06c.36.32.68.94.68 1.9c0 1.37-.01 2.47-.01 2.81c0 .26.18.59.69.48A10.27 10.27 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/></svg>
          </a>
          <a class="social" href="https://instagram.com" target="_blank" rel="noopener" title="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm11 1.5a1.25 1.25 0 1 1 0 2.5a1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6a3 3 0 0 0 0-6z"/></svg>
          </a>
          <a class="social" href="https://spotify.com" target="_blank" rel="noopener" title="Spotify">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20zm4.6 14.4c-.2.3-.5.4-.8.2c-2.2-1.3-5-1.6-8.3-.9c-.3.1-.7-.1-.8-.4c-.1-.3.1-.7.4-.8c3.6-.8 6.7-.4 9.2 1.1c.3.1.4.5.3.8zm1.2-2.7c-.2.4-.7.5-1 .3c-2.5-1.5-6.4-2-9.4-1.1c-.4.1-.8-.1-.9-.5c-.1-.4.1-.8.5-.9c3.4-1 7.7-.5 10.6 1.2c.4.2.5.6.2 1zm.1-2.8C14.5 8.9 9.3 8.7 6.2 9.6c-.5.1-1-.2-1.1-.6c-.2-.5.1-1 .6-1.1c3.6-1.1 9.4-.9 13.1 1.3c.4.2.6.8.3 1.2c-.2.4-.8.6-1.2.3z"/></svg>
          </a>
        </nav>
      </section>

      <aside class="player" aria-label="Audio player">
        <button type="button" id="playBtn" class="player-btn" aria-label="Pause">
          <svg id="iconPause" viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h3v14H7V5zm7 0h3v14h-3V5z"/></svg>
          <svg id="iconPlay" class="is-hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7L8 5z"/></svg>
        </button>
        <div class="player-info">
          <div class="player-title">Midnight Demo</div>
          <button type="button" id="seekBar" class="player-bar" aria-label="Seek">
            <div id="progress" class="player-progress"></div>
          </button>
        </div>
        <div class="volume">
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.45" aria-label="Volume" />
        </div>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <audio id="audio" src="assets/audio.mp3" loop preload="auto"></audio>
    <script src="js/app.js"></script>
  </body>
</html>
